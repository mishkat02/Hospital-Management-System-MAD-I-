<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background-color: rgb(189, 227, 239);">
    <div class="my_container">

         <div class="my_signin">
            <form action="/register" method="post">
                <div class="logo text-center mt-4">
                    <h1>Clinix</h1>
                    <br>
                </div>
                <h3 class="text-center">Create your Account</h3>
                <br>
                
                <div class="form">
                    <label for="Email">Email</label> <br>
                    <input type="text" class="form-control" id="Email"  placeholder="xyz@gmail.com" name="email">
                    
                    <label for="Username" class="mt-3">Username</label> <br>
                    <input type="text" class="form-control" id="Username"  placeholder="Username" name="username">
                </div>
                
                <div class="form">
                    <label for="Password">Password</label> <br>
                    <input type="password" class="form-control" id="Password" placeholder="Password" name="pwd">
                    <br>
                </div>
                
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <p class="mt-2">Already have an account? <a href="/login">Login</a></p>
                </div>
             </form>
        </div>
    </div>
</body>
</html>
