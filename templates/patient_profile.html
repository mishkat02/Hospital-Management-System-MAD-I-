<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient Profile</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" xintegrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background-color: rgb(189, 227, 239);">
    <div class="my_container">

         <div class="my_signin">
            <!-- Action submits to the specific user's ID -->
            <form action="{{ url_for('edit_patient_profile', user_id=user.id) }}" method="post">
                <div class="logo text-center mt-4">
                    <h1>Clinix</h1>
                    <br>
                </div>
                <h3 class="text-center">Update Your Profile</h3>
                <br>
                
                <div class="form">
                    <!-- Display read-only User Credentials -->
                    <label for="Username_readonly">Username (Login ID)</label> <br>
                    <input type="text" class="form-control" id="Username_readonly" value="{{ user.username }}" readonly>

                    <label for="Email_readonly" class="mt-3">Email</label> <br>
                    <input type="email" class="form-control" id="Email_readonly" value="{{ user.email }}" readonly>
                    
                    <br>
                    <!-- Editable Patient Profile Fields -->
                    <h5 class="mb-3">Patient Details</h5>
                    <label for="Name">Full Name</label> <br>
                    <input type="text" class="form-control" id="Name" name="full_name" value="{{ patient.full_name }}" required>
                    
                    <!-- You can add more patient fields here (e.g., phone, address) once they are added to models.py -->
                    
                </div>
                
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                    <!-- Back button, redirects to the dashboard -->
                    <a href="{{ url_for('patient_dashboard', user_id=user.id) }}" class="btn btn-secondary mt-1">Back to Dashboard</a>
                </div>
             </form>
        </div>
    </div>
</body>
</html>
