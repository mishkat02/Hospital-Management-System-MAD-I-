<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Edit Patient</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background-color: rgb(189, 227, 239);">
    <div class="my_container">

         <div class="my_signin">
            <form action="{{ url_for('admin_edit_patient', patient_id=patient.id) }}" method="post">
                <div class="logo text-center mt-4">
                    <h1>Clinix</h1>
                    <br>
                </div>
                <h3 class="text-center">Edit Patient: {{ patient.full_name }}</h3>
                <br>
                
                <div class="form">
                    <label for="Username_readonly">Username (Login ID)</label> <br>
                    <input type="text" class="form-control" id="Username_readonly" value="{{ user.username }}" readonly>

                    <label for="Email_readonly" class="mt-3">Email</label> <br>
                    <input type="email" class="form-control" id="Email_readonly" value="{{ user.email }}" readonly>
                    
                    <br>
                    <h5 class="mb-3">Patient Details</h5>
                    <label for="Name">Full Name</label> <br>
                    <input type="text" class="form-control" id="Name" name="full_name" value="{{ patient.full_name }}" required>
                    
                </div>
                
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary ">Update Patient Details</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-1">Back to Dashboard</a>
                </div>
             </form>
        </div>
    </div>
</body>
</html>
