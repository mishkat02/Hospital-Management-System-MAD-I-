<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" xintegrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background-color: rgb(189, 227, 239);">
    <div class="my_container">

         <div class="my_signin">
            <!-- Action submits to the specific doctor's ID -->
            <form action="{{ url_for('edit_doctor', doc_id=doctor.id) }}" method="post">
                <div class="logo text-center mt-4">
                    <h1>Clinix</h1>
                    <br>
                </div>
                <h3 class="text-center">Edit Doctor: {{ doctor.full_name }}</h3>
                <br>
                
                <div class="form">
                    <!-- Display read-only User Credentials -->
                    <label for="Username_readonly">Username (Login ID)</label> <br>
                    <input type="text" class="form-control" id="Username_readonly" value="{{ user.username }}" readonly>

                    <label for="Email_readonly" class="mt-3">Email</label> <br>
                    <input type="email" class="form-control" id="Email_readonly" value="{{ user.email }}" readonly>
                    
                    <!-- Editable Doctor Profile Fields -->
                    <label for="Name">Full Name</label> <br>
                    <input type="text" class="form-control" id="Name" name="full_name" value="{{ doctor.full_name }}" required>
                    
                    <label for="Username" class="mt-3">Specialization/Department</label> <br>
                    <input type="text" class="form-control" id="Username" name="department_name" value="{{ current_dept_name }}" required>
                </div>
                
                <div class="form">
                    <label for="Qualification">Qualification</label> <br>
                    <input type="text" class="form-control" id="Qualification" name="qualification" value="{{ doctor.qualification or '' }}">
                    <br>
                    <label for="Experience">Experience (Years)</label> <br>
                    <input type="number" class="form-control" id="Experience" name="experience" min="0" value="{{ doctor.experience_years or 0 }}">
                    <br>
                </div>
                
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary">Update Doctor Details</button>
                </div>
             </form>
        </div>
    </div>
</body>
</html>
