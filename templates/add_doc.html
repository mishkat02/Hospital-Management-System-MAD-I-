<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor</title>   <!-- page title -->
    <link rel="stylesheet" href="/static/styles/main.css"> <!-- join with css -->   <!-- link bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" xintegrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body style="background-color: rgb(189, 227, 239);"> <!-- inline style to set bg color to ice blue -->
    <div class="my_container">

         <div class="my_signin">
            <form action="{{ url_for('add_doctor') }}" method="post">
                <div class="logo text-center mt-4">
                    <h1>Clinix</h1>
                    <br>
                </div>
                <h3 class="text-center">Add a New Doctor</h3>
                <br>
                
                <div class="form">
                    <!-- Doctor's Profile Details (Full Name) -->
                    <label for="Name">Full Name</label> <br>
                    <input type="text" class="form-control" id="Name" name="full_name" placeholder="" required>

                    <!-- Doctor's Specialization -->
                    <label for="Username" class="mt-3">Specialization/Department</label> <br>
                    <input type="text" class="form-control" id="Username" name="department_name" placeholder="" required>
                </div>
                
                <div class="form">
                    <!-- Doctor's Qualification and Experience -->
                    <label for="Qualification">Qualification (Optional)</label> <br>
                    <input type="text" class="form-control" id="Qualification" name="qualification" placeholder="e.g., MBBS, MD Cardiology">

                    <label for="Experience" class="mt-3">Experience (Years)</label> <br>
                    <!-- Changed input type to number and adjusted name -->
                    <input type="number" class="form-control" id="Experience" name="experience" min="0" placeholder="e.g., 5">
                    <br>

                    <!-- USER ACCOUNT DETAILS (Required for login) -->
                    <h5 class="mb-3">Doctor Login Credentials</h5>

                    <label for="username_login">Username (for login)</label>
                    <input type="text" class="form-control" id="username_login" name="username" required>

                    <label for="email" class="mt-3">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>

                    <label for="password">Initial Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <br>
                </div>
                
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary">Create Doctor Account</button>
                </div>
             </form>
        </div>
    </div>
</body>
</html>
